[workspace]
members = ["crates/processcraft-core", "crates/processcraft-io", "crates/processcraft-render", "apps/processcraft", "apps/processcraft-cli"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.98.1"
publish = false
license = "MIT"
description = "Offline, native BPMN 2.0 process modeling workbench"
readme = "README.md"

[workspace.dependencies]
uuid = { version = "1", default-features = false, features = ["std", "v4"] }
egui = { version = "=0.37.0", default-features = false }
eframe = { version = "=0.37.0", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "acc262e69cd7a048bba323c63a764e310fa0d500", default-features = false }

# craft-ui uses the Craft egui extensions. Keep every shared egui type on
# the same revision as the pinned Craft workspace, including its winit fix.
[patch.crates-io]
ecolor = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
emath = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
epaint_default_fonts = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui-winit = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
egui_glow = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
eframe = { git = "https://github.com/storytold/egui.git", rev = "6d518fc799681571963842f95b55a6b68431b15a" }
winit = { git = "https://github.com/storytold/winit.git", rev = "a517b3846ee8457d84ee4975110bfda6797c44dc" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Full debug info made `target` grow past 25 GB; line tables keep backtraces and save the disk.
[profile.dev]
debug = "line-tables-only"

[profile.test]
debug = "line-tables-only"
