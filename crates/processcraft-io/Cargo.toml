[package]
name = "processcraft-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
description.workspace = true

[dependencies]
processcraft-core = { path = "../processcraft-core" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10"
png = "0.17"
zip = { version = "=2.4.2", default-features = false, features = ["deflate"] }
quick-xml = { version = "=0.42.0", default-features = false }
uuid = { workspace = true, features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Memory"] }

# Architecture section 18 permits reviewed OS adapters. Only save::windows,
# recovery::private and windows_pipe override this deny; other code stays safe.
[lints.rust]
unsafe_code = "deny"




