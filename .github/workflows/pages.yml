name: Pages

# Publishes site/ (pages, style.css, images) with the README screenshots and the app icon to GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", "assets/app-icon/processcraft-256.png", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/images
          cp site/*.html site/style.css _site/
          cp site/images/* _site/images/
          cp docs/images/*.png _site/images/
          cp assets/app-icon/processcraft-256.png _site/icon.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
