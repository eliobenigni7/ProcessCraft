name: Windows release

# Builds the MSI and the portable ZIP with packaging/windows/package.ps1.
# Manual runs keep the packages as workflow artifacts; a `v*` tag also attaches them to a draft
# GitHub release. The packages are unsigned until the SignPath Foundation open-source signing
# request is approved; signing then plugs in through PROCESSCRAFT_SIGN / a SignPath step here.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: gates
    runs-on: windows-latest
    env:
      WIX_VERSION: 5.0.2
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version $env:WIX_VERSION
          wix extension add -g "WixToolset.UI.wixext/$env:WIX_VERSION" "WixToolset.Util.wixext/$env:WIX_VERSION"

      - name: Package
        run: ./packaging/windows/package.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: processcraft-windows-x64
          path: dist/release/*
          if-no-files-found: error

      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        # The tag must name the Cargo.toml version (v0.1.0, or v0.1.0-rc.1 for a prerelease) so the
        # release title and the package file names agree.
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = $env:GITHUB_REF_NAME
          if ($tag -ne "v$version" -and -not $tag.StartsWith("v$version-")) { throw "tag $tag does not match Cargo.toml version $version" }
          $pre = if ($tag.Contains('-')) { '--prerelease' } else { $null }
          gh release create $tag dist/release/* --draft $pre --title "ProcessCraft $tag" --notes "Unsigned Windows build."
